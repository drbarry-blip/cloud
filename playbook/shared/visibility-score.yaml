# Visibility Score weights and thresholds. Defaults come from SPEC.md Appendix B.
# Total = 100: reputation 40 + booking ease 30 + website speed 20 + profile completeness 10.
# If a signal can't be measured (e.g., Google returns no review dates), it's dropped and the rest re-weighted.

competitors:
  search_terms_from: "clinic-types/*.yaml -> competitor_search_terms"
  min_results: 5
  keep_top: 10
  start_radius_miles: 5
  max_radius_miles: 25

pillars:
  reputation:
    max_points: 40
    signals:
      rating_vs_median:
        max_points: 15
        bands:
          - { label: "0.2+ stars above the local median", min_diff: 0.2,   points: 15 }
          - { label: "Within 0.2 of the median",          min_diff: -0.2,  points: 10 }
          - { label: "0.2-0.5 below the median",          min_diff: -0.5,  points: 5 }
          - { label: "More than 0.5 below",               min_diff: null,  points: 0 }
      review_count_vs_competitors:
        max_points: 15
        bands:
          - { label: "Top quarter",    min_percentile: 75, points: 15 }
          - { label: "Above median",   min_percentile: 50, points: 11 }
          - { label: "Below median",   min_percentile: 25, points: 7 }
          - { label: "Bottom quarter", min_percentile: 0,  points: 3 }
        no_reviews_points: 0
      newest_review_age:
        max_points: 10
        bands:
          - { label: "Within 14 days", max_days: 14,   points: 10 }
          - { label: "Within 30 days", max_days: 30,   points: 7 }
          - { label: "Within 90 days", max_days: 90,   points: 4 }
          - { label: "Older",          max_days: null, points: 0 }

  booking_ease:
    max_points: 30
    signals:
      online_booking_detected: 10
      tap_to_call_on_mobile: 5
      short_contact_form: 5            # 5 or fewer fields, or online booking present
      text_or_chat_option: 5
      new_patient_button_above_fold: 5 # visible on a phone screen without scrolling
    short_form_max_fields: 5

  website_speed:
    max_points: 20
    signals:
      pagespeed_mobile:
        max_points: 10
        bands:
          - { label: "90+",      min_score: 90, points: 10 }
          - { label: "50-89",    min_score: 50, points: 6 }
          - { label: "Under 50", min_score: 0,  points: 2 }
      core_web_vitals:
        max_points: 5
        pass_points: 5
        no_field_data_fallback: { lab_load_seconds_max: 2.5, points: 3 }
      https_and_mobile_layout: 5

  profile_completeness:
    max_points: 10
    signals:
      hours_listed: 3
      website_linked: 2
      phone_listed: 2
      photos_5_or_more: 3

