  - { name: "HubSpot forms", domains: ["hsforms.net", "hsforms.com"] }
  - { name: "Typeform",     domains: ["typeform.com"] }
  - { name: "Wufoo",        domains: ["wufoo.com"] }
  - { name: "Formstack",    domains: ["formstack.com"] }
  - { name: "Google Forms", domains: ["docs.google.com/forms", "forms.gle"] }

# The free score uses these pre-written quick wins (no AI), picked from the weakest signals.
quick_wins:
  rating_vs_median: "Your rating trails nearby competitors. Reply to every review and fix the issues that come up most."
  core_web_vitals: "Your site feels slow to real visitors on phones. Ask your web person to fix loading and layout shifts."
  https_and_mobile_layout: "Make sure your site uses HTTPS and a mobile-friendly layout. Browsers warn visitors about insecure sites."
  website_linked: "Add your website link to your Google Business Profile."
  phone_listed: "Add your phone number to your Google Business Profile."
  online_booking_detected: "Add online booking. Patients who can book at 10 pm won't wait until you open."
  tap_to_call_on_mobile: "Make your phone number tappable on mobile so one tap starts a call."
  short_contact_form: "Cut your contact form to 5 fields or fewer: name, phone, email, service, message."
  text_or_chat_option: "Offer a text or chat option. Many patients would rather text than call."
  new_patient_button_above_fold: "Put a 'Book your first visit' button at the top of your homepage on mobile."
  newest_review_age: "Ask happy patients for reviews every week. Recent reviews matter to searchers."
  review_count_vs_competitors: "You have fewer reviews than nearby competitors. Start a simple review-request routine."
  pagespeed_mobile: "Your site loads slowly on phones. Ask your web person to compress images and remove unused plugins."
  hours_listed: "Add your hours to your Google Business Profile."
  photos_5_or_more: "Add at least 5 recent photos to your Google Business Profile: team, lobby, treatment rooms."
