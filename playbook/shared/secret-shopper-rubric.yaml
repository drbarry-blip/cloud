# How Secret Shopper tests are scored. Defaults come from SPEC.md Appendix A.
# Total = 100 points: speed 35 + persistence 25 + conversation quality 30 + reachability 10 (split confirmed by owner, 2026-09-25).
# Criteria that don't apply to a persona are dropped and the rest rescaled.
# The examples teach the AI grader. They're invented, and "$X" marks prices on purpose.

grades:                 # minimum score for each letter; below D is F
  A: 85
  B: 70
  C: 55
  D: 40

parts:
  speed:
    max_points: 35
    measure: "Business-hours minutes from the inquiry to the first human response, per persona. The test score is the average across personas."
    # Owner's standard (2026-09-25): a human reply within 1 hour earns full marks.
    # (SPEC.md Appendix A's stricter 5-minute default is replaced here.)
    bands:
      - { label: "Within 1 hour",     max_business_minutes: 60,  points: 35 }
      - { label: "Within 2 hours",    max_business_minutes: 120, points: 28 }
      - { label: "Within 4 hours",    max_business_minutes: 240, points: 20 }
      - { label: "Same business day", rule: same_business_day,   points: 12 }
      - { label: "Next business day", rule: next_business_day,   points: 5 }
      - { label: "Later",             rule: later,               points: 2 }
      - { label: "Never",             rule: never,               points: 0 }
    fix: "Get a person back to every new inquiry within the hour, ideally by phone."
    after_hours_bonus:
      points: 5
      when: "An after-hours inquiry gets an instant auto-reply that includes a booking link"
      cap: 35

  persistence:
    max_points: 25
    counted_for: [silent]        # mainly the Silent persona, who never replies
    bands:
      - { label: "No human touches", min_touches: 0, max_touches: 0,    points: 0 }
      - { label: "1 touch",          min_touches: 1, max_touches: 1,    points: 5 }
      - { label: "2 touches",        min_touches: 2, max_touches: 2,    points: 10 }
      - { label: "3-4 touches",      min_touches: 3, max_touches: 4,    points: 17 }
      - { label: "5 or more",        min_touches: 5, max_touches: null, points: 22 }
    fix: "Keep following up for 10 days: at least 5 attempts across calls, texts, and email, spread over several days."
    spread_bonus:
      points: 3
      when: "Touches span at least 3 different days and 2 channels"
      cap: 25

  conversation_quality:
    max_points: 30
    graded_by: ai
    evidence_rule: "Every point awarded or withheld must quote the clinic's own words. No quote, no score."
    averaged_over: "All human replies across personas"
    criteria:
      - id: answered_question
        fix: "Answer the question the patient actually asked before anything else."
        points: 6
        description: "Replied to what the patient actually asked, not a generic template."
        good_example: "Great question! A first neurotoxin visit here is usually $X-$Y depending on the areas, and the consult is free."
        bad_example: "Thanks for reaching out! Please call us at your convenience."

      - id: asked_for_appointment
        fix: "End every reply by asking for the appointment: offer two specific times."
        points: 8
        description: "Asked for the appointment or gave one clear next step."
        good_example: "I have Tuesday at 10:30 or Thursday at 4:00. Want me to hold one of those for you?"
        bad_example: "Let us know if you have any other questions!"

      - id: easy_booking
        fix: "Include a direct booking link or two specific open times in every reply."
        points: 5
        description: "Made booking easy: a direct booking link or specific times."
        good_example: "You can grab any open time here: {booking_link}"
        bad_example: "Give us a call during business hours to schedule."

      - id: price_clarity
        fix: "When someone asks about price, give a price or a range, then explain what affects it."
        points: 4
        applies_when: "The patient asked about price"   # owner confirmed (2026-09-25): a price or range earns full marks
        description: "Gave a price or range, or explained what it depends on and when they'll know."
        good_example: "Most new patients pay $X-$Y. The exact price depends on {factor}, which we confirm at your consult."
        bad_example: "Pricing is discussed at the consultation."

      - id: objection_handling
        fix: "When price is a concern, offer a smaller first step, a package, or a payment plan instead of going quiet."
        points: 4
        applies_to: [price_check]
        description: "Responded helpfully after 'that's more than I expected': options, value, payment plans, a smaller first step."
        good_example: "Totally understand. A lot of patients start with {smaller_option}, or use our payment plan. Want me to walk you through it?"
        bad_example: "(no reply after the objection)"

      - id: tone
        fix: "Keep replies warm and professional: greet by name, thank them, and proofread."
        points: 3
        description: "Warm, professional, and free of errors."
        good_example: "Hi Jess! Thanks so much for reaching out."
        bad_example: "we got ur message call us"

  reachability:
    max_points: 10
    criteria:
      - id: channel_match
        fix: "Reply on the channel the patient used, and offer the others."
        points: 4
        description: "Replied on the channel the patient used, or offered other ways to connect."
      - id: voicemail_quality
        fix: "Voicemails should give your name, the clinic, the callback number twice, and a clear next step."
        points: 4
        applies_when: "The clinic left a voicemail"
        description: "Voicemail gave a name, the clinic, the callback number (ideally twice), a reason (generic for sensitive services), and a next step."
      - id: direct_path
        fix: "Every follow-up should include a direct way to book or call back."
        points: 2
        description: "Follow-ups included a direct way to book or call back."

# Shown in the report as "worth a look". Never scored, and never framed as legal conclusions.
observations_not_scored:
  - id: unsupported_claims
    look_for: "Guaranteed results; 'FDA-approved' for compounded drugs; 'painless'; 'permanent'; promised pounds lost"
  - id: sensitive_info_by_plain_message
    look_for: "Asking for medical history, insurance card photos, or ID by plain email or text"
  - id: pressure_tactics
    look_for: "Today-only prices, repeated hard upsells"
  - id: sensitive_details_in_voicemail_or_text
    look_for: "Naming a sensitive service or health details in a voicemail or text"
